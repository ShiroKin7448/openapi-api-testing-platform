openapi: 3.0.3
info:
  title: Swagger Petstore (benchmark subset - JSON only, a few extra min/max constraints added)
  version: 1.0.0
servers:
  - url: http://localhost:8090
tags:
  - name: pet
  - name: store
  - name: user
paths:
  /pet:
    post:
      tags: [pet]
      operationId: addPet
      summary: Add a new pet to the store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { description: Invalid input }
    put:
      tags: [pet]
      operationId: updatePet
      summary: Update an existing pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pet' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '400': { description: Invalid ID supplied }
  /pet/findByStatus:
    get:
      tags: [pet]
      operationId: findPetsByStatus
      summary: Finds pets by status
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, enum: [available, pending, sold] }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
        '400': { description: Invalid status value }
  /pet/{petId}:
    get:
      tags: [pet]
      operationId: getPetById
      summary: Find pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404': { description: Pet not found }
    delete:
      tags: [pet]
      operationId: deletePet
      summary: Deletes a pet
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: Pet deleted }
        '400': { description: Invalid pet value }
  /store/inventory:
    get:
      tags: [store]
      operationId: getInventory
      summary: Returns pet inventories by status
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: integer, format: int32 }
  /store/order:
    post:
      tags: [store]
      operationId: placeOrder
      summary: Place an order for a pet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid input }
  /store/order/{orderId}:
    get:
      tags: [store]
      operationId: getOrderById
      summary: Find purchase order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1, maximum: 10 }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { description: Order not found }
    delete:
      tags: [store]
      operationId: deleteOrder
      summary: Delete purchase order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { description: Order deleted }
        '404': { description: Order not found }
  /user:
    post:
      tags: [user]
      operationId: createUser
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Invalid input }
  /user/{username}:
    get:
      tags: [user]
      operationId: getUserByName
      summary: Get user by user name
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { description: User not found }
    put:
      tags: [user]
      operationId: updateUser
      summary: Update user
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 30 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { description: Invalid input }
    delete:
      tags: [user]
      operationId: deleteUser
      summary: Delete user
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 30 }
      responses:
        '200': { description: User deleted }
        '404': { description: User not found }
components:
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 50 }
    Pet:
      type: object
      required: [name, photoUrls]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        category: { $ref: '#/components/schemas/Category' }
        name: { type: string, minLength: 1, maxLength: 50 }
        photoUrls:
          type: array
          minItems: 1
          items: { type: string }
        status: { type: string, enum: [available, pending, sold] }
    Order:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        petId: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, format: int32, minimum: 1, maximum: 100 }
        shipDate: { type: string, format: date-time }
        status: { type: string, enum: [placed, approved, delivered] }
        complete: { type: boolean }
    User:
      type: object
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        username: { type: string, minLength: 3, maxLength: 30 }
        email: { type: string, format: email }
        userStatus: { type: integer, format: int32, minimum: 0, maximum: 3 }
