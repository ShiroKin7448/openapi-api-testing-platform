openapi: 3.1.0
info:
  title: Deterministic E2E Sample API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /login:
    post:
      operationId: fixtureLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getUser
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      operationId: deleteUser
      responses:
        '204': { description: User deleted }
  /products:
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock]
              properties:
                name: { type: string, minLength: 3, maxLength: 100 }
                price: { type: number, minimum: 50, maximum: 100000000 }
                stock: { type: integer, minimum: 1, maximum: 5000 }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, productId, quantity, deliveryDate]
              properties:
                userId: { type: string, format: uuid }
                productId: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1, maximum: 100 }
                deliveryDate: { type: string, format: date }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /payments/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credit_card, secret, billingDetails, orderId, amount]
              properties:
                credit_card: { type: string }
                secret: { type: string, minLength: 3 }
                billingDetails:
                  type: object
                  required: [name, address]
                  properties:
                    name: { type: string }
                    address:
                      type: object
                      required: [street, city, zip]
                      properties:
                        street: { type: string }
                        city: { type: string }
                        zip: { type: string }
                orderId: { type: string, format: uuid }
                amount: { type: number, minimum: 1, maximum: 500000000 }
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /validation-error:
    get:
      operationId: validationError
      responses:
        '400':
          description: Validation failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /unauthorized:
    get:
      operationId: unauthorized
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /server-error:
    get:
      operationId: serverError
      responses:
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /schema-violation:
    get:
      operationId: schemaViolation
      responses:
        '200':
          description: Deliberately invalid response schema
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
  /malformed:
    get:
      operationId: malformedBody
      responses:
        '200':
          description: Malformed JSON response
          content:
            application/json:
              schema: { type: object }
  /slow:
    get:
      operationId: slowResponse
      parameters:
        - name: ms
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Delayed response
          content:
            application/json:
              schema:
                type: object
                properties:
                  delay: { type: integer }
  /parallel-a:
    get:
      operationId: parallelA
      responses:
        '200':
          description: Parallel request A
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /parallel-b:
    get:
      operationId: parallelB
      responses:
        '200':
          description: Parallel request B
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
  /slow-timeout:
    get:
      operationId: slowTimeout
      responses:
        '200':
          description: Deterministically slow response for timeout testing
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
components:
  schemas:
    User:
      type: object
      required: [id, userId, email, displayName]
      properties:
        id: { type: string }
        userId: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
    Product:
      type: object
      required: [id, productId, name, price, stock]
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        price: { type: number }
        stock: { type: integer }
    Order:
      type: object
      required: [id, orderId, userId, productId, quantity, deliveryDate, status]
      properties:
        id: { type: string }
        orderId: { type: string }
        userId: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        deliveryDate: { type: string }
        status: { type: string }
    Payment:
      type: object
      required: [paymentId, orderId, status, amount]
      properties:
        paymentId: { type: string }
        orderId: { type: string }
        status: { type: string }
        amount: { type: number }
    Problem:
      type: object
      required: [message]
      properties:
        message: { type: string }
